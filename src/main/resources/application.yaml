spring:
  application:
    name: restful-api
  # configure datasource
  datasource:
    url: jdbc:postgresql://localhost:5432/exercise-1
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  # Configure JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 4242

